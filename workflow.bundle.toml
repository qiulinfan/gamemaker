schema_version = 1

[bundle]
name = "autota"
version = "1.0.0"
description = "AutoTA: an evidence-driven technical-art pipeline (search, 2D, 3D, rig alignment, hosted generation) that sits midstream between design briefs and engine integration"
skills_root = "skills"
workflows_root = "workflows"
profiles_root = "profiles"
agents_root = ".codex/agents"

[provenance]
source_repository = "git@github.com:qiulinfan/qiulinfan.github.io.git"
source_revision = "0e4cce8a474197170942e9b10984706bb9b95a05"
migrated_generated_files = false

[[provenance.sources]]
repository = "https://github.com/qiulinfan/ImageToPixel.git"
revision = "152bab66d3def65e6eaa5cd6ba97c00ac754ee31"
scope = "General pixelization, ordered-frame processing, preview, sprite-sheet composition, and audit concepts reimplemented as create-2d-game-art"
source_license = "none_declared"
migrated_project_assets = false
migrated_notebooks = false

[legal]
status = "unresolved"
license_file = ""
reason = "No license file or declared repository license was found; owner selection is required."

[link]
skills_destination = "skills"
agents_destination = "agents"
product_destination = "workflow-products/autota"
receipt_destination = "state/autota/install-receipt.json"
mode = "direct-working-tree-link"

[[skills]]
name = "search-game-art"
path = "skills/search-game-art"
phases = ["art-discovery", "provenance"]

[[skills]]
name = "create-2d-game-art"
path = "skills/create-2d-game-art"
phases = ["art-production", "technical-validation"]

[[skills]]
name = "auto-ta"
path = "skills/auto-ta"
phases = ["art-production", "technical-validation"]

[[skills]]
name = "generate-hosted-game-art"
path = "skills/generate-hosted-game-art"
phases = ["art-discovery", "art-production"]

[[skills]]
name = "character-rig-animation-alignment"
path = "skills/character-rig-animation-alignment"
phases = ["art-production", "engine-integration", "verification"]

[[workflows]]
name = "handoff-contract"
path = "workflows/handoff-contract.md"
entry_skill = "auto-ta"

[[agents]]
name = "autota_technical_artist"
path = ".codex/agents/autota-technical-artist.toml"
primary_skills = ["create-2d-game-art", "auto-ta", "character-rig-animation-alignment", "generate-hosted-game-art"]

[[agents]]
name = "autota_art_scout"
path = ".codex/agents/autota-art-scout.toml"
primary_skills = ["search-game-art"]

[[profiles]]
id = "dreamweaver"
path = "profiles/dreamweaver/profile.toml"
enabled_by_default = false
