schema_version = 1

[bundle]
name = "gamemaker"
version = "0.3.0"
description = "Portable evidence-driven game-production workflow bundle for Codex focused on coordination, design, and 2D/3D art production"
skills_root = "skills"
workflows_root = "workflows"
profiles_root = "profiles"
agents_root = ".codex/agents"

[provenance]
source_repository = "git@github.com:qiulinfan/qiulinfan.github.io.git"
source_revision = "0e4cce8a474197170942e9b10984706bb9b95a05"
migrated_generated_files = false

[[provenance.sources]]
repository = "https://github.com/qiulinfan/ImageToPixel.git"
revision = "152bab66d3def65e6eaa5cd6ba97c00ac754ee31"
scope = "General pixelization, ordered-frame processing, preview, sprite-sheet composition, and audit concepts reimplemented as create-2d-game-art"
source_license = "none_declared"
migrated_project_assets = false
migrated_notebooks = false

[legal]
status = "unresolved"
license_file = ""
reason = "No license file or declared repository license was found; owner selection is required."

[link]
skills_destination = "skills"
agents_destination = "agents"
product_destination = "workflow-products/gamemaker"
receipt_destination = "state/gamemaker/install-receipt.json"
mode = "direct-working-tree-link"

[[skills]]
name = "coordinate-game-production"
path = "skills/coordinate-game-production"
phases = ["intake", "routing", "integration", "acceptance"]

[[skills]]
name = "write-game-design-brief"
path = "skills/write-game-design-brief"
phases = ["ready", "design"]

[[skills]]
name = "discuss-game-design"
path = "skills/discuss-game-design"
phases = ["discovery", "design"]

[[skills]]
name = "search-game-art"
path = "skills/search-game-art"
phases = ["art-discovery", "provenance"]

[[skills]]
name = "create-2d-game-art"
path = "skills/create-2d-game-art"
phases = ["art-production", "technical-validation"]

[[skills]]
name = "auto-ta"
path = "skills/auto-ta"
phases = ["art-production", "technical-validation"]

[[skills]]
name = "character-rig-animation-alignment"
path = "skills/character-rig-animation-alignment"
phases = ["art-production", "engine-integration", "verification"]

[[workflows]]
name = "game-production"
path = "workflows/game-production.md"
entry_skill = "coordinate-game-production"

[[workflows]]
name = "agile-iteration"
path = "workflows/agile-iteration.md"
entry_skill = "coordinate-game-production"

[[workflows]]
name = "handoff-contract"
path = "workflows/handoff-contract.md"
entry_skill = "coordinate-game-production"

[[agents]]
name = "gamemaker_producer"
path = ".codex/agents/gamemaker-producer.toml"
primary_skills = ["coordinate-game-production"]

[[agents]]
name = "gamemaker_designer"
path = ".codex/agents/gamemaker-designer.toml"
primary_skills = ["write-game-design-brief", "discuss-game-design"]

[[agents]]
name = "gamemaker_technical_artist"
path = ".codex/agents/gamemaker-technical-artist.toml"
primary_skills = ["create-2d-game-art", "auto-ta", "character-rig-animation-alignment"]

[[agents]]
name = "gamemaker_art_scout"
path = ".codex/agents/gamemaker-art-scout.toml"
primary_skills = ["search-game-art"]

[[agents]]
name = "gamemaker_reviewer"
path = ".codex/agents/gamemaker-reviewer.toml"
primary_skills = ["coordinate-game-production"]

[[profiles]]
id = "dreamweaver"
path = "profiles/dreamweaver/profile.toml"
enabled_by_default = false

[[profiles]]
id = "multica"
path = "profiles/multica/profile.toml"
enabled_by_default = false

[[profiles]]
id = "google-drive"
path = "profiles/google-drive/profile.toml"
enabled_by_default = false
